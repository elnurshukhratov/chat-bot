# fly.toml app configuration file generated for chat-bot-qjxpaq on 2026-11-21T08:39:02Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'chat-bot-qjxpaq'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
